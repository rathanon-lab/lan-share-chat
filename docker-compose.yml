services:
  lan-share-chat:
    build: .
    container_name: lan-share-chat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-Asia/Bangkok}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - PUBLIC_HTTPS_URL=${PUBLIC_HTTPS_URL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_me_strong_admin_password}
      - MEDIA_SECRET=${MEDIA_SECRET:-}
      - MAX_CHAT_FILE_SIZE_MB=${MAX_CHAT_FILE_SIZE_MB:-1024}
      - MAX_P2P_FILE_SIZE_MB=${MAX_P2P_FILE_SIZE_MB:-1024}
      - MAX_CHAT_FILES_BATCH=${MAX_CHAT_FILES_BATCH:-10}
      - MIN_DISK_FREE_MB=${MIN_DISK_FREE_MB:-512}
      - STORAGE_MAX_TOTAL_GB=${STORAGE_MAX_TOTAL_GB:-0}
      - STORAGE_MAX_UPLOADS_GB=${STORAGE_MAX_UPLOADS_GB:-0}
      - STORAGE_MAX_STICKERS_MB=${STORAGE_MAX_STICKERS_MB:-0}
      - STORAGE_MAX_CACHE_MB=${STORAGE_MAX_CACHE_MB:-0}
      - STORAGE_MAX_CHUNKS_MB=${STORAGE_MAX_CHUNKS_MB:-0}
      - STORAGE_MAX_AVATARS_MB=${STORAGE_MAX_AVATARS_MB:-0}
      - STORAGE_WARN_DB_MB=${STORAGE_WARN_DB_MB:-2048}
    volumes:
      # Segregated Docker Virtual Volumes (override via .env e.g. STORAGE_UPLOADS_VOL=/mnt/disk2/uploads or ./storage/uploads)
      - ${STORAGE_DB_VOL:-lan_chat_db}:/app/storage/db
      - ${STORAGE_UPLOADS_VOL:-lan_chat_uploads}:/app/storage/uploads
      - ${STORAGE_STICKERS_VOL:-lan_chat_stickers}:/app/storage/stickers
      - ${STORAGE_AVATARS_VOL:-lan_chat_avatars}:/app/storage/avatars
      - ${STORAGE_CACHE_VOL:-lan_chat_cache}:/app/storage/video-cache
      - ${STORAGE_CHUNKS_VOL:-lan_chat_chunks}:/app/storage/chunks
    # When deploying behind Server-Lab-A2 Nginx Proxy Manager (https://chat.lab.lan):
    #   Nginx terminates HTTPS at the edge and proxies plain HTTP -> http://lan-share-chat:3000

volumes:
  lan_chat_db:
  lan_chat_uploads:
  lan_chat_stickers:
  lan_chat_avatars:
  lan_chat_cache:
  lan_chat_chunks:
